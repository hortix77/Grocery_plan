<!DOCTYPE html>
<html>

<head>
    <title>Place Order</title>
    <style>
        body {
            background: #ecf0f1;
            font-family: Arial
        }
        
        form {
            width: 350px;
            margin: 80px auto;
            background: white;
            padding: 20px;
            border-radius: 10px
        }
        
        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0
        }
        
        button {
            background: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            width: 100%
        }
    </style>
</head>

<body>
    <form method="POST">
        {% csrf_token %}
        <h2>Order: {{pname}}</h2>
        <input type="text" name="name" placeholder="Your Name" required>
        <input type="text" name="phone" placeholder="Phone Number" required>
        <textarea name="address" placeholder="Address" required></textarea>
        <button>Place Order - ₹{{price}}</button>
    </form>
</body>

</html>

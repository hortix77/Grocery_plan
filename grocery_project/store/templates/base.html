{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Grocery Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success px-3">
        <a class="navbar-brand" href="/">🛒 Grocery Store</a>
        <div class="ms-auto">
        {% if user.is_authenticated %}

        {% if user.is_staff %}
        <a href="{% url 'dashboard' %}" class="btn btn-dark">Dashboard</a>
        {% endif %}

        <a href="/cart" class="btn btn-light">Cart</a>
        <a href="/payment" class="btn btn-light">Payment</a>
        <a href="/orders" class="btn btn-light">Orders</a>
        <a href="/logout" class="btn btn-light">Logout</a>

        {% else %}
        <a href="/login" class="btn btn-light">Login</a>
        <a href="/register" class="btn btn-primary">Register</a>
        {% endif %}
    </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

</body>

</html>

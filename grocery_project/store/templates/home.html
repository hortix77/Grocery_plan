{% load static %}
<!DOCTYPE html>
<html>

<head>
    <title>Grocery Store</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #d4fc79, #96e6a1);
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(90deg, #11998e, #38ef7d) !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .navbar-brand {
            font-weight: 600;
            font-size: 22px;
            letter-spacing: 1px;
        }

        .card {
            border: none;
            border-radius: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .card img {
            height: 200px;
            object-fit: cover;
        }

        .card-body h5 {
            font-weight: 600;
        }

        .card-body p {
            font-size: 18px;
            font-weight: 500;
            color: #11998e;
        }

        .btn-success {
            background: linear-gradient(90deg, #11998e, #38ef7d);
            border: none;
            border-radius: 25px;
            font-weight: 500;
            transition: 0.3s;
        }

        .btn-success:hover {
            background: linear-gradient(90deg, #0f9b8e, #2ecc71);
            transform: scale(1.05);
        }

        .btn-light {
            border-radius: 20px;
            font-weight: 500;
        }

        .btn-danger {
            border-radius: 20px;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark px-3">
        <span class="navbar-brand">🛒 Grocery Store</span>
        <div>
            <a href="/cart" class="btn btn-light me-2">Cart</a>
            <a href="/logout" class="btn btn-danger">Logout</a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row g-4">
            {% for p in products %}
            <div class="col-md-3">
                <div class="card shadow">
                    <img src="{{p.image.url}}" class="card-img-top">
                    <div class="card-body text-center">
                        <h5>{{p.name}}</h5>
                        <p>₹ {{p.price}}</p>
                        <a href="/add/{{p.id}}" class="btn btn-success w-100">Add to Cart</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

</body>

</html>
